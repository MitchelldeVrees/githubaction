name: Backtest

# Runs backtest.py on real price data whenever the backtest code changes on this
# branch, uploads each variant's trades and summary as an artifact, and commits
# all results of the run to the backtest-results branch under runs/.

on:
  push:
    branches: [jdb-dominance]
    paths:
      - backtest.py
      - scanner.py
      - .github/workflows/backtest.yml
  workflow_dispatch:

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adjusted
            auto_adjust: "true"
            cache: adjusted
            args: ""
          - name: raw
            auto_adjust: "false"
            cache: raw
            args: ""
          - name: adjusted_pullback_ride
            auto_adjust: "true"
            cache: adjusted
            args: "--setups pullback --pullback-target none"
          - name: adjusted_baseline
            auto_adjust: "true"
            cache: adjusted
            args: "--setups break,retracement --baseline 5"
          - name: adjusted_pullback_ride_baseline
            auto_adjust: "true"
            cache: adjusted
            args: "--setups pullback --pullback-target none --baseline 3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Yahoo price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backtest
        env:
          YFINANCE_AUTO_ADJUST: ${{ matrix.auto_adjust }}
          YFINANCE_BATCH_SIZE: "25"
          YFINANCE_BATCH_DELAY_SECONDS: "5"
        run: python backtest.py --out results/backtest_${{ matrix.name }} ${{ matrix.args }}

      - name: Save Yahoo price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.name }}
          path: results/backtest_${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Commit results to the backtest-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backtest-results; then
            git fetch --depth 1 origin backtest-results
            git checkout -B backtest-results FETCH_HEAD
          else
            git checkout --orphan backtest-results
            git rm -rf --quiet .
          fi
          dest="runs/$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p "$dest"
          cp -r "${{ runner.temp }}/artifacts/." "$dest/"
          git add runs
          git commit -m "Backtest results for ${GITHUB_SHA::7}"
          git push origin backtest-results
