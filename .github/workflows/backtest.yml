name: Backtest

# Runs backtest.py on real price data whenever the backtest code changes on this
# branch, uploads each variant's trades and summary as an artifact, and commits
# all results of the run to the backtest-results branch under runs/.

on:
  push:
    branches: [jdb-dominance]
    paths:
      - backtest.py
      - scanner.py
      - top_tickers.py
      - tickers_indices.txt
      - .github/workflows/backtest.yml
  workflow_dispatch:

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adjusted
            auto_adjust: "true"
            cache: adjusted
            args: ""
          - name: raw
            auto_adjust: "false"
            cache: raw
            args: ""
          - name: adjusted_pullback_ride
            auto_adjust: "true"
            cache: adjusted
            args: "--setups pullback --pullback-target none"
          - name: adjusted_baseline
            auto_adjust: "true"
            cache: adjusted
            args: "--setups break,retracement --baseline 5"
          - name: adjusted_pullback_ride_baseline
            auto_adjust: "true"
            cache: adjusted
            args: "--setups pullback --pullback-target none --baseline 3"
          - name: indices
            auto_adjust: "true"
            cache: indices
            args: "--tickers-file tickers_indices.txt --baseline 5"
          - name: indices_pullback_ride
            auto_adjust: "true"
            cache: indices
            args: "--tickers-file tickers_indices.txt --setups pullback --pullback-target none --baseline 3"
          # The rules from reviewing trades on the chart (Nov 2026), on unadjusted
          # prices like TradingView: all together, then each change on its own.
          - name: raw_reviewed
            auto_adjust: "false"
            cache: raw
            settings: "DIVERGENCE_SOURCE=close DIVERGENCE_MIN_GAP=8 DIVERGENCE_MIN_PRICE_PCT=1 DIVERGENCE_MIN_RSI_DIFF=3 DIVERGENCE_MAX_AGE=13 TOUCH_CLUSTERS=true TOUCH_IGNORE_LAST=5 CLEAN_FINAL_BARS=20"
            args: "--stop-trigger close --entry-max-atr 1.5 --skip-target-hit --pullback-lengths 20,50 --pullback-skip-divergence"
          - name: raw_baseline
            auto_adjust: "false"
            cache: raw
            args: "--setups break,retracement --baseline 5"
          - name: raw_reviewed_baseline
            auto_adjust: "false"
            cache: raw
            settings: "DIVERGENCE_SOURCE=close DIVERGENCE_MIN_GAP=8 DIVERGENCE_MIN_PRICE_PCT=1 DIVERGENCE_MIN_RSI_DIFF=3 DIVERGENCE_MAX_AGE=13 TOUCH_CLUSTERS=true TOUCH_IGNORE_LAST=5 CLEAN_FINAL_BARS=20"
            args: "--setups break,retracement --stop-trigger close --entry-max-atr 1.5 --skip-target-hit --baseline 5"
          - name: raw_only_dominance
            auto_adjust: "false"
            cache: raw
            settings: "TOUCH_CLUSTERS=true TOUCH_IGNORE_LAST=5 CLEAN_FINAL_BARS=20"
            args: ""
          - name: raw_only_divergence
            auto_adjust: "false"
            cache: raw
            settings: "DIVERGENCE_SOURCE=close DIVERGENCE_MIN_GAP=8 DIVERGENCE_MIN_PRICE_PCT=1 DIVERGENCE_MIN_RSI_DIFF=3 DIVERGENCE_MAX_AGE=13"
            args: ""
          - name: raw_only_entry
            auto_adjust: "false"
            cache: raw
            args: "--entry-max-atr 1.5 --skip-target-hit"
          - name: raw_only_close_stop
            auto_adjust: "false"
            cache: raw
            args: "--stop-trigger close"
          # Only today's 100 largest companies of tickers.txt. Expected to flatter
          # the results (survivorship bias): compare with raw and raw_reviewed.
          - name: top100_raw
            auto_adjust: "false"
            cache: raw
            top100: "true"
            args: ""
          - name: top100_reviewed
            auto_adjust: "false"
            cache: raw
            top100: "true"
            settings: "DIVERGENCE_SOURCE=close DIVERGENCE_MIN_GAP=8 DIVERGENCE_MIN_PRICE_PCT=1 DIVERGENCE_MIN_RSI_DIFF=3 DIVERGENCE_MAX_AGE=13 TOUCH_CLUSTERS=true TOUCH_IGNORE_LAST=5 CLEAN_FINAL_BARS=20"
            args: "--stop-trigger close --entry-max-atr 1.5 --skip-target-hit --pullback-lengths 20,50 --pullback-skip-divergence"
          - name: raw_only_pullback
            auto_adjust: "false"
            cache: raw
            args: "--setups pullback --pullback-lengths 20,50 --pullback-skip-divergence"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Yahoo price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Pick the largest tickers
        if: matrix.top100 == 'true'
        run: |
          mkdir -p results/backtest_${{ matrix.name }}
          python top_tickers.py --count 100 --out results/backtest_${{ matrix.name }}/tickers_top100.txt

      # Signals from START_DATE on (the last 20 years); the averages still use
      # all earlier history.
      - name: Run backtest
        env:
          YFINANCE_AUTO_ADJUST: ${{ matrix.auto_adjust }}
          YFINANCE_BATCH_SIZE: "25"
          YFINANCE_BATCH_DELAY_SECONDS: "5"
          START_DATE: "2006-01-01"
          TICKERS_ARG: ${{ matrix.top100 == 'true' && format('--tickers-file results/backtest_{0}/tickers_top100.txt', matrix.name) || '' }}
        run: env ${{ matrix.settings }} python backtest.py --out results/backtest_${{ matrix.name }} --start "$START_DATE" $TICKERS_ARG ${{ matrix.args }}

      - name: Save Yahoo price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ matrix.cache }}-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.name }}
          path: results/backtest_${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Commit results to the backtest-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backtest-results; then
            git fetch --depth 1 origin backtest-results
            git checkout -B backtest-results FETCH_HEAD
          else
            git checkout --orphan backtest-results
            git rm -rf --quiet .
          fi
          dest="runs/$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p "$dest"
          cp -r "${{ runner.temp }}/artifacts/." "$dest/"
          git add runs
          git commit -m "Backtest results for ${GITHUB_SHA::7}"
          git push origin backtest-results
