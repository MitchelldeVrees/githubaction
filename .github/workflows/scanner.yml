name: Dominant MA/EMA Scanner

on:
  schedule:
    - cron: "0 20 * * 5"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a Telegram test message and skip the scanner"
        type: boolean
        required: false
        default: false
      commit_results:
        description: "Commit updated results/latest_results.csv and .json back to the repository"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Yahoo price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ github.run_id }}
          restore-keys: |
            yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-
            yfinance-price-cache-${{ runner.os }}-

      - name: Ensure price cache directory
        run: mkdir -p .cache/yfinance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run scanner
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_NO_SIGNAL_MESSAGE: ${{ vars.SEND_NO_SIGNAL_MESSAGE }}
          BULL_BARS_REQUIRED: ${{ vars.BULL_BARS_REQUIRED }}
          BEAR_BARS_REQUIRED: ${{ vars.BEAR_BARS_REQUIRED }}
          TOUCH_DISTANCE_PCT: ${{ vars.TOUCH_DISTANCE_PCT }}
          BOUNCE_LOOKBACK: ${{ vars.BOUNCE_LOOKBACK }}
          BOUNCE_WEIGHT: ${{ vars.BOUNCE_WEIGHT }}
          YFINANCE_PERIOD: ${{ vars.YFINANCE_PERIOD }}
          YFINANCE_AUTO_ADJUST: ${{ vars.YFINANCE_AUTO_ADJUST }}
          YFINANCE_INCREMENTAL_PERIOD: ${{ vars.YFINANCE_INCREMENTAL_PERIOD }}
          YFINANCE_BATCH_SIZE: ${{ vars.YFINANCE_BATCH_SIZE }}
          YFINANCE_MAX_RETRIES: ${{ vars.YFINANCE_MAX_RETRIES }}
          YFINANCE_RETRY_SLEEP_SECONDS: ${{ vars.YFINANCE_RETRY_SLEEP_SECONDS }}
          YFINANCE_BATCH_DELAY_SECONDS: ${{ vars.YFINANCE_BATCH_DELAY_SECONDS }}
          YFINANCE_THREADS: ${{ vars.YFINANCE_THREADS }}
          ENABLE_PRICE_CACHE: ${{ vars.ENABLE_PRICE_CACHE }}
          DATA_CACHE_DIR: ${{ vars.DATA_CACHE_DIR }}
          CACHE_STALE_DAYS: ${{ vars.CACHE_STALE_DAYS }}
          TELEGRAM_MAX_MESSAGE_CHARS: ${{ vars.TELEGRAM_MAX_MESSAGE_CHARS }}
        run: python scanner.py

      - name: Send Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --telegram-test

      - name: Save Yahoo price cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.telegram_test != true) }}
        uses: actions/cache/save@v4
        with:
          path: .cache/yfinance
          key: yfinance-price-cache-${{ runner.os }}-${{ hashFiles('tickers.txt') }}-${{ github.run_id }}

      - name: Upload scanner results
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_test != true }}
        uses: actions/upload-artifact@v4
        with:
          name: dominant-ma-alert-results
          path: |
            results/latest_results.csv
            results/latest_results.json
          if-no-files-found: error

      - name: Commit updated results
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.commit_results == true) || (github.event_name == 'schedule' && vars.COMMIT_RESULTS == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest_results.csv results/latest_results.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update scanner results"
            git push
          fi
